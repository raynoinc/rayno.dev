<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>آفلاین — راینو</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light dark; }
      html, body { margin: 0; min-height: 100%; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
        background: #ffffff;
        color: #0b1220;
        font-family: Tahoma, "Segoe UI", system-ui, sans-serif;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0a0f1a; color: #f1f5fb; }
        p { color: #b4bfd1 !important; }
        a { background: #ffffff !important; color: #0b1220 !important; }
      }
      main { max-width: 28rem; }
      img { width: 72px; height: 72px; margin-bottom: 24px; }
      h1 { font-size: 1.5rem; font-weight: 800; margin: 0 0 12px; }
      p { margin: 0 0 28px; font-size: 1rem; line-height: 1.8; color: #4a5468; }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 50px;
        padding: 0 22px;
        border-radius: 12px;
        background: #0b1220;
        color: #ffffff;
        text-decoration: none;
        font-size: 15px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="راینو" width="72" height="72" />
      <h1>شما آفلاین هستید</h1>
      <p>اتصال اینترنت برقرار نیست. وقتی دوباره آنلاین شدید، صفحه را تازه کنید.</p>
      <a href="/">تلاش دوباره</a>
    </main>
  </body>
</html>
